<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Autos — Test Drive Log</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Specifieke layout toevoegingen voor de Test Drive Grid */
      .test-drive-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 50px 20px;
      }

      .td-summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 50px;
      }

      .metric-card {
        background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
        border: 2px solid #333;
        border-radius: 10px;
        padding: 30px;
        text-align: center;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .metric-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
      }

      .metric-card:hover {
        border-color: #d4af37;
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
      }

      .metric-card h3 {
        color: #aaa;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0 0 18px 0;
        font-weight: 600;
      }

      .metric-value {
        color: #d4af37;
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .dashboard-layout {
        display: grid;
        grid-template-columns: 2.5fr 1fr;
        gap: 30px;
      }

      @media (max-width: 900px) {
        .dashboard-layout {
          grid-template-columns: 1fr;
        }
      }

      .section-title {
        color: #d4af37;
        font-size: 1.4rem;
        font-weight: 800;
        margin: 0 0 25px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
        padding-bottom: 12px;
      }

      .section-title::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 50px;
        height: 2px;
        background: #d4af37;
      }

      .search-clear-container {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }

      .search-clear-container input {
        flex: 1;
        padding: 13px 18px;
        background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
        border: 2px solid #333;
        color: #fff;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .search-clear-container input::placeholder {
        color: #666;
      }

      .search-clear-container input:focus {
        outline: none;
        border-color: #d4af37;
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
      }

      .search-clear-container button {
        background: linear-gradient(135deg, #d4af37 0%, #c99d2e 100%);
        color: #000;
        border: none;
        padding: 13px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
      }

      .search-clear-container button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
      }

      .td-card {
        background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
        border: 1px solid #333;
        border-radius: 10px;
        padding: 22px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        position: relative;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .td-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: linear-gradient(180deg, #d4af37, transparent);
        border-radius: 10px 0 0 10px;
      }

      .td-card:hover {
        border-color: #d4af37;
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
      }

      .td-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 12px;
        border-bottom: 1px solid #333;
      }

      .td-vehicle-title {
        color: #d4af37;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .td-date {
        color: #999;
        font-size: 0.8rem;
        background: rgba(212, 175, 55, 0.05);
        padding: 5px 12px;
        border-radius: 4px;
        border: 1px solid rgba(212, 175, 55, 0.15);
      }

      .td-row {
        margin-bottom: 10px;
        font-size: 0.95rem;
        color: #ddd;
        display: flex;
        align-items: center;
      }

      .td-row span {
        color: #aaa;
        font-weight: 600;
        margin-right: 8px;
        min-width: 90px;
      }

      .td-row::before {
        content: "▸";
        color: #d4af37;
        margin-right: 10px;
        opacity: 0.7;
      }

      .td-badge {
        display: inline-block;
        background: linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.15),
          rgba(212, 175, 55, 0.05)
        );
        color: #d4af37;
        padding: 7px 14px;
        border-radius: 5px;
        font-size: 0.85rem;
        font-weight: 700;
        margin-top: 12px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .leaderboard {
        background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
        border: 2px solid #333;
        border-radius: 10px;
        padding: 18px;
        max-height: 500px;
        overflow-y: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .leaderboard-item {
        display: flex;
        align-items: center;
        padding: 14px;
        margin-bottom: 10px;
        background: linear-gradient(
          135deg,
          rgba(26, 26, 26, 0.8) 0%,
          rgba(15, 15, 15, 0.8) 100%
        );
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
      }

      .leaderboard-item:hover {
        border-color: #d4af37;
        background: linear-gradient(
          135deg,
          rgba(26, 26, 26, 1) 0%,
          rgba(15, 15, 15, 1) 100%
        );
        transform: translateX(4px);
      }

      .leaderboard-rank {
        color: #d4af37;
        font-weight: 800;
        font-size: 1.1rem;
        width: 40px;
        text-align: center;
      }

      .leaderboard-name {
        flex: 1;
        color: #ddd;
        font-weight: 600;
        margin: 0 15px;
        font-size: 0.95rem;
      }

      .leaderboard-stats {
        display: flex;
        gap: 12px;
        font-size: 0.8rem;
      }

      .leaderboard-stats span {
        color: #aaa;
        background: rgba(212, 175, 55, 0.08);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid rgba(212, 175, 55, 0.1);
      }

      .leaderboard-stats span:first-child {
        color: #d4af37;
        font-weight: 700;
      }

      .sales-empty {
        text-align: center;
        padding: 35px;
        color: #aaa;
        background: linear-gradient(
          135deg,
          rgba(212, 175, 55, 0.05),
          rgba(212, 175, 55, 0.02)
        );
        border: 2px dashed #d4af37;
        border-radius: 8px;
        font-size: 0.95rem;
      }

      .modal {
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
      }

      .modal-content {
        background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
        border: 2px solid #d4af37;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      .form-group input {
        background: linear-gradient(
          135deg,
          #1a1a1a 0%,
          #0f0f0f 100%
        ) !important;
        border: 2px solid #333 !important;
        color: #fff !important;
        border-radius: 8px !important;
        transition: all 0.2s !important;
      }

      .form-group input:focus {
        border-color: #d4af37 !important;
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.3) !important;
      }

      .leaderboard::-webkit-scrollbar {
        width: 7px;
      }

      .leaderboard::-webkit-scrollbar-track {
        background: rgba(212, 175, 55, 0.05);
        border-radius: 4px;
      }

      .leaderboard::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 4px;
      }

      .leaderboard::-webkit-scrollbar-thumb:hover {
        background: #c99d2e;
      }
    </style>
  </head>
  <body class="dark-theme">
    <section class="hero">
      <div class="hero-content">
        <h1 class="brand-title">Test Drives Log</h1>
        <p class="tagline">
          This page runs entirely in the browser and shows local test drive
          history.
        </p>
        <a
          id="back-index-button"
          class="sell-submit back-button"
          href="index.html"
          >Back to Inventory</a
        >
      </div>
    </section>

    <div class="test-drive-container">
      <div class="td-summary-grid">
        <div class="metric-card">
          <h3>Total Test Drives</h3>
          <div class="metric-value" id="summary-td-count">0</div>
        </div>
        <div class="metric-card">
          <h3>Income Generated</h3>
          <div class="metric-value" id="summary-td-income">$0</div>
        </div>
        <div class="metric-card">
          <h3>Unique Vehicles</h3>
          <div class="metric-value" id="summary-td-vehicles">0</div>
        </div>
      </div>

      <div class="dashboard-layout">
        <div>
          <h2 class="section-title">Test Drive Entries</h2>
          <div class="search-clear-container">
            <input
              type="text"
              id="td-filter-input"
              placeholder="Search by vehicle or salesperson..."
            />
            <button id="td-clear-filter">Clear</button>
          </div>
          <div
            id="td-logs-list"
            style="display: grid; grid-template-columns: 1fr; gap: 0"
          ></div>
        </div>

        <div>
          <h2 class="section-title">Top Test Drivers</h2>
          <div id="td-leaderboard" class="leaderboard"></div>
        </div>
      </div>
    </div>

    <script src="test-drive.js"></script>
  </body>
</html>
