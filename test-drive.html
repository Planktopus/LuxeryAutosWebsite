<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Autos — Test Drive Log</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .test-drive-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 50px 20px;
      }

      .td-summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 50px;
      }

      .metric-card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 25px;
        text-align: center;
        transition: all 0.2s ease;
      }

      .metric-card:hover {
        border-color: #d4af37;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
      }

      .metric-card h3 {
        color: #999;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 0 0 15px 0;
        font-weight: 500;
      }

      .metric-value {
        color: #d4af37;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .dashboard-layout {
        display: grid;
        grid-template-columns: 2.5fr 1fr;
        gap: 30px;
      }

      @media (max-width: 900px) {
        .dashboard-layout {
          grid-template-columns: 1fr;
        }
      }

      .section-title {
        color: #d4af37;
        font-size: 1.3rem;
        font-weight: 700;
        margin: 0 0 20px 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .search-clear-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .search-clear-container input {
        flex: 1;
        padding: 12px 16px;
        background: #1a1a1a;
        border: 1px solid #333;
        color: #fff;
        border-radius: 6px;
        font-size: 1rem;
      }

      .search-clear-container input:focus {
        outline: none;
        border-color: #d4af37;
      }

      .search-clear-container button {
        background: #d4af37;
        color: #000;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: opacity 0.2s;
      }

      .search-clear-container button:hover {
        opacity: 0.9;
      }

      .td-card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
        transition: all 0.2s ease;
      }

      .td-card:hover {
        border-color: #d4af37;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15);
      }

      .td-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 12px;
        border-bottom: 1px solid #333;
      }

      .td-vehicle-title {
        color: #d4af37;
        font-size: 1.1rem;
        font-weight: 700;
      }

      .td-date {
        color: #888;
        font-size: 0.85rem;
      }

      .td-row {
        margin-bottom: 8px;
        font-size: 0.95rem;
        color: #ccc;
      }

      .td-row span {
        color: #888;
        font-weight: 500;
      }

      .td-badge {
        display: inline-block;
        background: rgba(212, 175, 55, 0.1);
        color: #d4af37;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-top: 10px;
        border: 1px solid rgba(212, 175, 55, 0.2);
      }

      .leaderboard {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 15px;
        max-height: 500px;
        overflow-y: auto;
      }

      .leaderboard-item {
        display: flex;
        align-items: center;
        padding: 12px;
        margin-bottom: 8px;
        background: #0f0f0f;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      .leaderboard-item:hover {
        border-color: #d4af37;
        background: #1a1a1a;
      }

      .leaderboard-rank {
        color: #d4af37;
        font-weight: bold;
        font-size: 1rem;
        width: 35px;
        text-align: center;
      }

      .leaderboard-name {
        flex: 1;
        color: #ccc;
        font-weight: 600;
        margin: 0 15px;
        font-size: 0.95rem;
      }

      .leaderboard-stats {
        display: flex;
        gap: 12px;
        font-size: 0.85rem;
      }

      .leaderboard-stats span {
        color: #999;
      }

      .leaderboard-stats span:first-child {
        color: #d4af37;
      }

      .sales-empty {
        text-align: center;
        padding: 30px;
        color: #999;
        background: #0f0f0f;
        border: 1px dashed #333;
        border-radius: 6px;
        font-size: 0.95rem;
      }

      .modal {
        background: rgba(0, 0, 0, 0.7);
      }

      .modal-content {
        background: #1a1a1a;
        border: 1px solid #d4af37;
      }

      .form-group input {
        background-color: #1a1a1a !important;
        border: 1px solid #333 !important;
        color: #fff !important;
        border-radius: 6px !important;
      }

      .form-group input:focus {
        border-color: #d4af37 !important;
      }

      .leaderboard::-webkit-scrollbar {
        width: 6px;
      }

      .leaderboard::-webkit-scrollbar-track {
        background: #0f0f0f;
      }

      .leaderboard::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 3px;
      }
    </style>
  </head>
  <body class="dark-theme">
    <header class="main-header">
      <div class="header-container">
        <h1 class="logo" onclick="window.location.href = 'index.html'" style="cursor: pointer">
          LUXURY <span>AUTOS</span>
        </h1>
        <nav class="nav-menu">
          <a href="index.html">Inventory</a>
          <a href="sales-log.html" id="sales-log-nav">Sales Log</a>
          <a href="test-drive.html" class="active">Test Drives</a>
        </nav>
      </div>
    </header>

    <div class="test-drive-container">
      <!-- Summary Cards -->
      <div class="td-summary-grid">
        <div class="metric-card">
          <h3>Total Test Drives</h3>
          <div class="metric-value" id="summary-td-count">0</div>
        </div>
        <div class="metric-card">
          <h3>Income Generated</h3>
          <div class="metric-value" id="summary-td-income">$0</div>
        </div>
        <div class="metric-card">
          <h3>Unique Vehicles</h3>
          <div class="metric-value" id="summary-td-vehicles">0</div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="dashboard-layout">
        <!-- Test Drives List -->
        <div>
          <h2 class="section-title">Test Drive Entries</h2>
          <div class="search-clear-container">
            <input
              type="text"
              id="td-filter-input"
              placeholder="Search by vehicle or salesperson..."
            />
            <button id="td-clear-filter">Clear</button>
          </div>
          <div id="td-logs-list" style="display: grid; grid-template-columns: 1fr; gap: 0">
            <!-- Test drives rendered here -->
          </div>
        </div>

        <!-- Leaderboard -->
        <div>
          <h2 class="section-title">Top Test Drivers</h2>
          <div id="td-leaderboard" class="leaderboard">
            <!-- Leaderboard rendered here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Login Modal -->
    <div id="sales-login-modal" class="modal">
      <div class="modal-content" style="max-width: 400px; text-align: center">
        <h2 class="modal-title">Admin Authentication</h2>
        <p style="color: #888; margin-bottom: 20px">
          Enter credentials to view the Test Drive Logs.
        </p>
        <form id="sales-login-form">
          <div class="form-group">
            <label for="sales-login-username">Username</label>
            <input
              type="text"
              id="sales-login-username"
              required
              style="width: 100%; box-sizing: border-box"
            />
          </div>
          <div class="form-group" style="margin-top: 15px">
            <label for="sales-login-password">Password</label>
            <input
              type="password"
              id="sales-login-password"
              required
              style="width: 100%; box-sizing: border-box"
            />
          </div>
          <div
            id="sales-login-error"
            style="margin-top: 15px; font-weight: 500; font-size: 0.9rem"
          ></div>
          <button
            type="submit"
            class="submit-btn"
            style="margin-top: 20px; width: 100%"
          >
            Authenticate
          </button>
        </form>
      </div>
    </div>

    <script src="test-drive.js"></script>
  </body>
</html>
